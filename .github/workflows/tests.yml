name: tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autoflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTOFLOW_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/autoflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Create disposable PostgreSQL migration database
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("CREATE DATABASE autoflow_migrations")
          PY
      - name: Test Alembic migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/autoflow_migrations
        run: alembic upgrade head
      - run: pip install bandit pip-audit
      - run: bandit -r app -ll
      - run: pip-audit -r requirements.txt
      - run: pytest -q
      - run: python scripts/check_frontend.py /tmp/autoflow
      - run: for file in /tmp/autoflow-*.js; do node --check "$file"; done
